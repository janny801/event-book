<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SASE Book Event</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>SASE Book Event</h1>

  <!-- Tab Navigation -->
  <div class="tab-container">
    <button class="tab-btn active" data-tab="0">Media Request</button>
    <button class="tab-btn" data-tab="1">Room Booking</button>
    <button class="tab-btn" data-tab="2">Reimbursement</button>
  </div>

  <!-- Forms -->
  <div class="form-container active">
    <h2>Media Request Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScIDZQJxaiQEQHvzED9IEEZq8RLBXDU5d_IVXJIEixJKskpTg/viewform?embedded=true"></iframe>
  </div>

  <div class="form-container">
    <h2>Room Booking Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeq7u3W_WL4CEst4upvS5iamE-Rdxfji8PcbypvH5sxGaPyMw/viewform?embedded=true"></iframe>
  </div>

  <div class="form-container">
    <h2>Reimbursement Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeeXCDWDeFkTFhq2D_ws0xgC7ywNJw63dqqA746_d_dRVkjkw/viewform?embedded=true"></iframe>
  </div>

  <script>
    const tabs = document.querySelectorAll('.tab-btn');
    const forms = document.querySelectorAll('.form-container');

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        forms.forEach(f => f.classList.remove('active'));

        tab.classList.add('active');
        forms[index].classList.add('active');

        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  </script>

</body>
</html>
