<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Nexus Forms</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 50px;
      font-size: 2em;
      color: #333;
    }

    .form-container {
      background-color: #ffffff;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      margin: 0 auto 60px auto;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      max-width: 1200px;
    }

    .form-container h2 {
      margin-bottom: 20px;
      color: #222;
    }

    iframe {
      width: 100%;
      height: 1000px;
      border: none;
      border-radius: 6px;
    }

    @media (max-width: 768px) {
      iframe {
        height: 1200px;
      }
    }
  </style>
</head>
<body>

  <h1>Project Nexus Forms</h1>

  <div class="form-container">
    <h2>Media Request Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScIDZQJxaiQEQHvzED9IEEZq8RLBXDU5d_IVXJIEixJKskpTg/viewform?embedded=true"></iframe>
  </div>

  <div class="form-container">
    <h2>Room Booking Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeq7u3W_WL4CEst4upvS5iamE-Rdxfji8PcbypvH5sxGaPyMw/viewform?embedded=true"></iframe>
  </div>

  <div class="form-container">
    <h2>Reimbursement Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeeXCDWDeFkTFhq2D_ws0xgC7ywNJw63dqqA746_d_dRVkjkw/viewform?embedded=true"></iframe>
  </div>

</body>
</html>
