<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SASE Book Event</title>
  <style>
    /* ---------- Global Page Styles ---------- */
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #e6f0ff, #f8f9fa);
      margin: 0;
      padding: 40px 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 60px;
      font-size: 2.5em;
      color: #004aad;
      background: linear-gradient(90deg, #004aad, #0077ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeIn 1.2s ease-in-out;
    }

    /* ---------- Form Container ---------- */
    .form-container {
      background-color: #ffffff;
      border: 1px solid #d1d9e6;
      border-radius: 15px;
      padding: 25px 30px;
      margin: 0 auto 60px auto;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 1500px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .form-container:hover {
      transform: scale(1.01);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    .form-container h2 {
      margin-bottom: 20px;
      color: #004aad;
      font-size: 1.5em;
      border-left: 5px solid #0077ff;
      padding-left: 10px;
      font-weight: 600;
    }

    /* ---------- Embedded Forms ---------- */
    iframe {
      width: 100%;
      height: 1100px;
      border: none;
      border-radius: 10px;
      background-color: #f0f4ff;
      animation: fadeIn 1s ease-in;
    }

    /* ---------- Responsive Design ---------- */
    @media (max-width: 1024px) {
      body {
        padding: 20px;
      }
      h1 {
        font-size: 2em;
      }
      iframe {
        height: 1250px;
      }
    }

    @media (max-width: 600px) {
      iframe {
        height: 1400px;
      }
    }

    /* ---------- Simple Animation ---------- */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>SASE Book Event</h1>

  <div class="form-container">
    <h2>Media Request Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScIDZQJxaiQEQHvzED9IEEZq8RLBXDU5d_IVXJIEixJKskpTg/viewform?embedded=true"></iframe>
  </div>

  <div class="form-container">
    <h2>Room Booking Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeq7u3W_WL4CEst4upvS5iamE-Rdxfji8PcbypvH5sxGaPyMw/viewform?embedded=true"></iframe>
  </div>

  <div class="form-container">
    <h2>Reimbursement Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeeXCDWDeFkTFhq2D_ws0xgC7ywNJw63dqqA746_d_dRVkjkw/viewform?embedded=true"></iframe>
  </div>

</body>
</html>
