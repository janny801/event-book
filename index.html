<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SASE Book Event</title>
  <style>
    /* ---------- Global Page Styles ---------- */
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #e6f0ff, #f8f9fa);
      margin: 0;
      padding: 40px 20px;
      color: #333;
      text-align: center;
    }

    h1 {
      margin-bottom: 50px;
      font-size: 2.5em;
      background: linear-gradient(90deg, #004aad, #0077ff);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeIn 1.2s ease-in-out;
    }

    /* ---------- Form Container ---------- */
    .form-container {
      background-color: #ffffff;
      border: 1px solid #d1d9e6;
      border-radius: 15px;
      padding: 25px 30px 80px 30px;
      margin: 0 auto;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 1500px;
      display: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .form-container.active {
      display: block;
    }

    .form-container h2 {
      margin-bottom: 20px;
      color: #004aad;
      font-size: 1.5em;
      border-left: 5px solid #0077ff;
      padding-left: 10px;
      font-weight: 600;
      text-align: left;
    }

    /* ---------- Iframe ---------- */
    iframe {
      width: 100%;
      height: 1100px;
      border: none;
      border-radius: 10px;
      background-color: #f0f4ff;
      animation: fadeIn 0.8s ease-in;
    }

    /* ---------- Button Container ---------- */
    .button-container {
      text-align: center;
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    button {
      cursor: pointer;
      background-color: #0077ff;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.1em;
      padding: 12px 25px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: background 0.3s ease;
    }

    button:hover:not(:disabled) {
      background-color: #004aad;
    }

    button:disabled {
      background-color: #a8c5ff;
      cursor: not-allowed;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 768px) {
      iframe {
        height: 1300px;
      }
      button {
        font-size: 1em;
        padding: 10px 20px;
      }
    }

    /* ---------- Animation ---------- */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>SASE Book Event</h1>

  <div class="form-container active">
    <h2>Media Request Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScIDZQJxaiQEQHvzED9IEEZq8RLBXDU5d_IVXJIEixJKskpTg/viewform?embedded=true"></iframe>
    <div class="button-container">
      <button class="back-btn" disabled>← Back</button>
      <button class="next-btn">Next →</button>
    </div>
  </div>

  <div class="form-container">
    <h2>Room Booking Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeq7u3W_WL4CEst4upvS5iamE-Rdxfji8PcbypvH5sxGaPyMw/viewform?embedded=true"></iframe>
    <div class="button-container">
      <button class="back-btn">← Back</button>
      <button class="next-btn">Next →</button>
    </div>
  </div>

  <div class="form-container">
    <h2>Reimbursement Form</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeeXCDWDeFkTFhq2D_ws0xgC7ywNJw63dqqA746_d_dRVkjkw/viewform?embedded=true"></iframe>
    <div class="button-container">
      <button class="back-btn">← Back</button>
      <button class="next-btn" disabled>Next →</button>
    </div>
  </div>

  <script>
    const forms = document.querySelectorAll('.form-container');
    const nextBtns = document.querySelectorAll('.next-btn');
    const backBtns = document.querySelectorAll('.back-btn');
    let current = 0;

    function showForm(index) {
      forms.forEach((form, i) => form.classList.toggle('active', i === index));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    nextBtns.forEach((btn, index) => {
      btn.addEventListener('click', () => {
        if (current < forms.length - 1) {
          current++;
          showForm(current);
        }
      });
    });

    backBtns.forEach((btn, index) => {
      btn.addEventListener('click', () => {
        if (current > 0) {
          current--;
          showForm(current);
        }
      });
    });
  </script>

</body>
</html>
